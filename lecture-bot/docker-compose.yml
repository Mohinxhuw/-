services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - bot-api-files:/var/lib/telegram-bot-api

  # Optional: self-hosted Telegram Bot API server for files larger than 20 MB.
  # Start with:  docker compose --profile bigfiles up -d
  # and set TELEGRAM_LOCAL_API_URL=http://telegram-bot-api:8081 in .env
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    profiles: ["bigfiles"]
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - bot-api-files:/var/lib/telegram-bot-api

volumes:
  bot-api-files:
